<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Mippi - Game Designer, Director, Toolmaker, Writer</title>
  <desc id="desc">A dark game-development inspired banner with node graph motifs and the name Mippi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#171124"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.8" r="0.7">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#8b949e" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="30" fill="url(#glowA)"/>
  <rect width="1400" height="420" rx="30" fill="url(#glowB)"/>
  <rect width="1400" height="420" rx="30" fill="url(#grid)"/>

  <!-- Blueprint-like graph lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M 90 90 C 210 90, 220 165, 355 165 S 520 95, 655 95" stroke="#58a6ff" stroke-opacity="0.36" stroke-width="4"/>
    <path d="M 1045 330 C 1150 330, 1160 248, 1310 248" stroke="#f778ba" stroke-opacity="0.34" stroke-width="4"/>
    <path d="M 1070 82 C 1145 82, 1160 138, 1280 138" stroke="#a371f7" stroke-opacity="0.34" stroke-width="4"/>
    <path d="M 115 320 C 210 320, 235 265, 350 265" stroke="#3fb950" stroke-opacity="0.28" stroke-width="4"/>
  </g>

  <!-- Nodes -->
  <g stroke-width="3">
    <circle cx="90" cy="90" r="10" fill="#090b12" stroke="#58a6ff"/>
    <circle cx="655" cy="95" r="10" fill="#090b12" stroke="#58a6ff"/>
    <circle cx="1045" cy="330" r="10" fill="#090b12" stroke="#f778ba"/>
    <circle cx="1310" cy="248" r="10" fill="#090b12" stroke="#f778ba"/>
    <circle cx="1070" cy="82" r="10" fill="#090b12" stroke="#a371f7"/>
    <circle cx="1280" cy="138" r="10" fill="#090b12" stroke="#a371f7"/>
    <circle cx="115" cy="320" r="10" fill="#090b12" stroke="#3fb950"/>
    <circle cx="350" cy="265" r="10" fill="#090b12" stroke="#3fb950"/>
  </g>

  <rect x="84" y="74" width="1232" height="272" rx="26" fill="#090b12" fill-opacity="0.44" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="158" y="108" width="1084" height="5" rx="2.5" fill="url(#accent)" filter="url(#softGlow)" opacity="0.92"/>

  <text x="700" y="220" text-anchor="middle" fill="#f0f6fc"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="14">MIPPI</text>

  <text x="700" y="268" text-anchor="middle" fill="#c9d1d9"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="4">
    GAME DESIGNER  •  DIRECTOR  •  TOOLMAKER  •  WRITER
  </text>

  <text x="700" y="312" text-anchor="middle" fill="#8b949e"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="2">
    25+ YEARS MAKING GAMES, SOLVING PROBLEMS, AND BUILDING BETTER WAYS TO WORK
  </text>
</svg>